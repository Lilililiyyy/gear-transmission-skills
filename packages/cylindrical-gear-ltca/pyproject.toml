[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "cylindrical-gear-ltca"
version = "0.2.0"
description = "渐开线圆柱齿轮半解析准静态承载齿面接触分析（LTCA）"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["LTCA", "cylindrical-gears", "loaded-tooth-contact-analysis", "microgeometry", "static-transmission-error", "mesh-stiffness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plots = ["matplotlib>=3.6"]

[project.scripts]
gear-ltca = "gear_contact.__main__:main"
gear-contact = "gear_contact.__main__:main"

[tool.setuptools]
packages = ["gear_contact"]
